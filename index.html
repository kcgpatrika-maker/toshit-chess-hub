<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">  
<meta name="theme-color" content="#0f2027">
<title>Toshit Chess Hub</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">  

<!-- ✅ REQUIRED CHESS LIBS -->
<link rel="stylesheet" href="chessboard-1.0.0.min.css">
<script src="chess.min.js"></script>
<script src="chessboard-1.0.0.min.js"></script>
<style>
/* (आपका पूरा CSS same रखा गया है) */
body {
  margin:0;
  font-family:Arial, sans-serif;
  color:#fff;
  text-align:center;
  background:
    linear-gradient(rgba(20,20,20,0.85), rgba(20,20,20,0.85)),
    linear-gradient(45deg, #dcdcdc 25%, transparent 25%),
    linear-gradient(-45deg, #dcdcdc 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #dcdcdc 75%),
    linear-gradient(-45deg, transparent 75%, #dcdcdc 75%);
  background-size:40px 40px;
}

h2 {
  font-size:28px;
  padding:15px;
  background: linear-gradient(90deg, #ffcc00, #ff9800);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.title-bar {
  height:4px;
  background: linear-gradient(90deg, #ffcc00, #ff9800);
}

button {
  width:90%;
  max-width:340px;
  padding:18px;
  margin:12px auto;
  font-size:20px;
  border:none;
  border-radius:14px;
  background:#1e88e5;
  color:#fff;
  display:block;
}

.screen { display:none; }
.active { display:block; }

.start-btn {
  background: linear-gradient(90deg, #00c853, #64dd17);
}

#board {
  width:320px;
  margin:20px auto;
}
#board {
  width:320px;
  height:320px;
  margin:20px auto;
  background:#fff;
}  
</style>
</head>

<body>

<h2>♕♔ TOSHIT CHESS HUB ♘♖</h2>
<div class="title-bar"></div>

<!-- HOME -->
<div id="home" class="screen active">
<button onclick="go('play')">▶ Play Like GM</button>
<button onclick="startTraining()">🧠 Daily Training</button>
<button onclick="go('tools')">⚡ Quick Tools</button>
<button onclick="go('stats')">📊 My Progress</button>
<button onclick="openRajasthan()">🏆 Rajasthan Chess Results</button>
</div>

<!-- PLAY -->
<div id="play" class="screen">
<h3>Select Grandmaster</h3>

<button onclick="setPlayer('carlsen')">Carlsen</button>
<button onclick="setPlayer('anand')">Anand</button>
<button onclick="setPlayer('tal')">Tal</button>
<button onclick="setPlayer('hikaru')">Hikaru</button>

<h3>Select Time</h3>
<button onclick="setTime('blitz')">Blitz</button>
<button onclick="setTime('rapid')">Rapid</button>

<button class="start-btn" onclick="startGame()">🚀 START GAME</button>
<button onclick="go('home')">⬅ Back</button>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen">
<h3 id="gmName"></h3>
<div id="board"></div>
<button onclick="go('home')">⬅ Exit</button>
</div>

<script>

let player="", game, board;

// navigation
function go(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function setPlayer(p){
  player = p;
  alert("Selected: " + p);
}

function startGame(){

  if(player===""){
    alert("Select Grandmaster");
    return;
  }

  go("game");

  document.getElementById("gmName").innerText = "Playing vs " + player.toUpperCase();

  setTimeout(()=>{

    game = new Chess();

    board = Chessboard('board', {
      position: 'start',
      draggable: true,
      pieceTheme: 'https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/img/chesspieces/wikipedia/{piece}.png'
    });

  }, 300);
}
// PLAYER MOVE
function onDrop(source, target){

  let move = game.move({
    from: source,
    to: target,
    promotion: 'q'
  });

  if(move === null) return 'snapback';

  setTimeout(makeAIMove, 300);
}

// AI MOVE (simple engine)
function makeAIMove(){

  let moves = game.moves();

  // GM difficulty
  let move;

  if(player==="carlsen"){
    move = moves[Math.floor(Math.random()*moves.length)];
  }
  else if(player==="anand"){
    move = moves[Math.floor(Math.random()*moves.length)];
  }
  else if(player==="tal"){
    move = moves[Math.floor(Math.random()*moves.length)];
  }
  else{
    move = moves[Math.floor(Math.random()*moves.length)];
  }

  game.move(move);
  board.position(game.fen());
}

// बाकी आपका code untouched
function startTraining(){
  window.open("https://lichess.org/training","_blank");
}

function openRajasthan(){
  window.open("https://chess-results.com/fed.aspx?lan=1&fed=IND&bdld1=22", "_blank");
}

</script>

</body>
</html>
