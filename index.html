<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toshit Chess Hub</title>

<style>
body {
  margin:0;
  font-family:Arial;
  color:#fff;
  text-align:center;
  background:#111;
}

/* TITLE */
h2 {
  font-size:26px;
  padding:15px;
  color:#ffcc00;
}

/* BUTTON */
button {
  width:90%;
  max-width:340px;
  padding:16px;
  margin:10px auto;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#1e88e5;
  color:#fff;
  display:block;
}

.start-btn {
  background: linear-gradient(90deg, #00c853, #64dd17);
  font-size:20px;
  font-weight:bold;
}

.back {
  background:#444;
}

/* SCREEN */
.screen { display:none; }
.active { display:block; }

/* TRAINER BOARD (NO LIBRARY — ALWAYS WORKS) */
#trainerBoard {
  width:320px;
  height:320px;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(8,1fr);
}

.square {
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.white { background:#eee; color:#000; }
.black { background:#555; }

.desc {
  width:90%;
  max-width:340px;
  margin:0 auto 10px;
  font-size:15px;
  color:#ddd;
}
</style>
</head>

<body>

<h2>♔ ♕ ♙ TOSHIT CHESS HUB ♖ ♘ ♗</h2>

<!-- HOME -->
<div id="home" class="screen active">

<button onclick="go('play')">▶ Play Like GM</button>
<div class="desc">Grandmaster style में real platform पर खेलें</div>

<button onclick="startTraining()">🧠 Daily Training</button>
<div class="desc">Puzzle + Game + Analysis routine</div>

<button onclick="go('trainer')">🎯 Guess Move Trainer</button>
<div class="desc">Best move पहचानना सीखें</div>

</div>

<!-- PLAY -->
<div id="play" class="screen">

<h3>Select Grandmaster</h3>

<button onclick="setPlayer('carlsen')">Carlsen</button>
<button onclick="setPlayer('anand')">Anand</button>
<button onclick="setPlayer('tal')">Tal</button>
<button onclick="setPlayer('hikaru')">Hikaru</button>

<h3>Select Time</h3>

<button onclick="setTime('blitz')">Blitz</button>
<button onclick="setTime('rapid')">Rapid</button>

<button class="start-btn" onclick="startGame()">🚀 START GAME</button>
<button class="back" onclick="go('home')">⬅ Back</button>

</div>

<!-- TRAINER -->
<div id="trainer" class="screen">

<h3>🎯 Guess the Best Move</h3>

<div id="trainerBoard"></div>

<p>White to move — Best move क्या है?</p>

<button onclick="checkMove('Qg7')">Qg7#</button>
<button onclick="checkMove('Qh7')">Qh7</button>
<button onclick="checkMove('Qe8')">Qe8</button>

<p id="result"></p>

<button class="back" onclick="go('home')">⬅ Back</button>

</div>

<script>

let player="", time="";

// navigation
function go(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(id==="trainer"){
    loadPuzzle();
  }
}

// selection
function setPlayer(p){
  player=p;
  alert("Selected: " + p);
}

function setTime(t){
  time=t;
}

// START GAME (GM redirect)
function startGame(){

  if(player===""){
    alert("Select Grandmaster");
    return;
  }

  if(player==="carlsen"){
    window.location.href="https://lichess.org/";
  }
  else if(player==="anand"){
    window.location.href="https://www.chess.com/play";
  }
  else if(player==="tal"){
    window.location.href="https://lichess.org/training";
  }
  else if(player==="hikaru"){
    window.location.href="https://www.chess.com/play/online";
  }
}

// TRAINING
function startTraining(){

  window.open("https://lichess.org/training","_blank");

  setTimeout(()=>{
    window.open("https://www.chess.com/play/computer","_blank");
  },3000);
}

// ✅ PUZZLE BOARD (NO LIBRARY — STABLE)
function loadPuzzle(){

  let board = document.getElementById("trainerBoard");
  board.innerHTML="";

  // PUZZLE POSITION (Mate in 1)
  let pieces = [
    "","","","","♚","","","",
    "","","","","","","♟","",
    "","","","","","","","",
    "","","","","","","","♕",
    "","","","","","","","",
    "","","","","","","","",
    "","","","","","","","",
    "","","","","♔","","",""
  ];

  for(let i=0;i<64;i++){
    let sq = document.createElement("div");

    let row = Math.floor(i/8);
    let col = i%8;

    sq.className = "square " + ((row+col)%2===0 ? "white":"black");
    sq.innerText = pieces[i];

    board.appendChild(sq);
  }
}

// answer check
function checkMove(move){

  if(move==="Qg7"){
    result.innerHTML="✅ शानदार! यह checkmate है (GM move)";
  } else {
    result.innerHTML="❌ गलत! सही move: Qg7#";
  }
}

</script>

</body>
</html>
