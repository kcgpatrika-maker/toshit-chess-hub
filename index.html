<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toshit Chess Hub</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#111;
  color:#fff;
  text-align:center;
}

h2 {
  color:#ffcc00;
  padding:15px;
}

button {
  width:90%;
  max-width:340px;
  padding:15px;
  margin:8px auto;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#1e88e5;
  color:#fff;
  display:block;
}

button:active {
  transform:scale(0.96);
}

.start-btn {
  background:linear-gradient(90deg,#00c853,#64dd17);
  font-size:20px;
}

.back {
  background:#444;
}

.screen { display:none; }
.active { display:block; }

.desc {
  width:90%;
  max-width:340px;
  margin:0 auto 10px;
  font-size:14px;
  color:#ccc;
}

/* review buttons */
.opt {
  background:#333;
}
.opt.selected {
  background:#00c853;
}
</style>
</head>

<body>

<h2>♔ ♕ ♙ TOSHIT CHESS HUB ♖ ♘ ♗</h2>

<!-- HOME -->
<div id="home" class="screen active">

<button onclick="go('play')">▶ Play Like GM</button>
<div class="desc">GM style में game खेलें</div>

<button onclick="startTraining()">🧠 Daily Training</button>
<div class="desc">Puzzle → Game → Review</div>

<button onclick="go('tools')">⚡ Quick Tools</button>
<div class="desc">Game / Puzzle / Analysis</div>

<button onclick="go('stats')">📊 My Progress</button>
<div class="desc">Games & Reviews count</div>

</div>

<!-- PLAY -->
<div id="play" class="screen">

<h3>Select GM</h3>

<button onclick="setPlayer('carlsen')">Carlsen</button>
<button onclick="setPlayer('anand')">Anand</button>
<button onclick="setPlayer('tal')">Tal</button>

<button class="start-btn" onclick="startGame()">START GAME</button>
<button class="back" onclick="go('home')">Back</button>

</div>

<!-- TOOLS -->
<div id="tools" class="screen">

<h3>Quick Tools</h3>

<button onclick="playGame()">Play Game</button>
<button onclick="openPuzzle()">Solve Puzzle</button>
<button onclick="openAnalysis()">Analyze</button>

<button class="back" onclick="go('home')">Back</button>

</div>

<!-- REVIEW -->
<div id="review" class="screen">

<h3>📊 Game Review (2 min)</h3>

<p>❌ Biggest Mistake?</p>
<button class="opt" onclick="selectOpt(1,this)">Blunder</button>
<button class="opt" onclick="selectOpt(1,this)">Time Pressure</button>
<button class="opt" onclick="selectOpt(1,this)">Opening Mistake</button>

<p>⚠️ Missed Opportunity?</p>
<button class="opt" onclick="selectOpt(2,this)">Mate Miss</button>
<button class="opt" onclick="selectOpt(2,this)">Capture Miss</button>
<button class="opt" onclick="selectOpt(2,this)">Better Move</button>

<p>✔ Best Part?</p>
<button class="opt" onclick="selectOpt(3,this)">Good Attack</button>
<button class="opt" onclick="selectOpt(3,this)">Solid Defense</button>
<button class="opt" onclick="selectOpt(3,this)">Lucky Win</button>

<button onclick="openAnalysis()">🔍 Analyze Game</button>

<button id="finishBtn" class="start-btn" disabled onclick="finishReview()">Finish Review</button>

</div>

<!-- STATS -->
<div id="stats" class="screen">

<h3>My Progress</h3>

<p>Games: <span id="games">0</span></p>
<p>Reviews: <span id="reviews">0</span></p>

<button onclick="resetStats()">Reset</button>
<button class="back" onclick="go('home')">Back</button>

</div>

<script>

let player="";
let reviewData = {1:false,2:false,3:false};

// navigation
function go(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// PLAYER
function setPlayer(p){
  player=p;
  alert("Selected: "+p);
}

// START GAME (GM)
function startGame(){

  if(player===""){
    alert("Select GM");
    return;
  }

  localStorage.setItem("needReview","yes");

  window.location.href="https://www.chess.com/play";
}

// DAILY TRAINING
function startTraining(){

  localStorage.setItem("needReview","yes");

  window.open("https://lichess.org/training","_blank");

  setTimeout(()=>{
    window.open("https://www.chess.com/play/computer","_blank");
  },3000);
}

// QUICK GAME
function playGame(){
  localStorage.setItem("needReview","yes");
  window.location.href="https://www.chess.com/play";
}

// TOOLS
function openPuzzle(){
  window.location.href="https://lichess.org/training";
}

function openAnalysis(){
  window.location.href="https://lichess.org/analysis";
}

// REVIEW OPTIONS
function selectOpt(group, el){

  document.querySelectorAll(".opt").forEach(b=>{
    if(b.parentElement === el.parentElement){
      b.classList.remove("selected");
    }
  });

  el.classList.add("selected");
  reviewData[group]=true;

  checkFinish();
}

// ENABLE FINISH
function checkFinish(){
  if(reviewData[1] && reviewData[2] && reviewData[3]){
    document.getElementById("finishBtn").disabled=false;
  }
}

// FINISH REVIEW
function finishReview(){

  let g = parseInt(localStorage.getItem("games")||0);
  let r = parseInt(localStorage.getItem("reviews")||0);

  localStorage.setItem("games", g+1);
  localStorage.setItem("reviews", r+1);

  localStorage.removeItem("needReview");

  loadStats();
  go("home");
}

// STATS
function loadStats(){
  document.getElementById("games").innerText = localStorage.getItem("games")||0;
  document.getElementById("reviews").innerText = localStorage.getItem("reviews")||0;
}

function resetStats(){
  localStorage.clear();
  loadStats();
}

// AUTO REVIEW TRIGGER
window.onload = function(){

  loadStats();

  if(localStorage.getItem("needReview") === "yes"){
    go("review");
  }
};

</script>

</body>
</html>
