<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toshit Chess Hub</title>

<style>
body {
  margin:0;
  font-family:Arial;
  color:#fff;
  text-align:center;
  background:#111;
}

h2 {
  font-size:26px;
  padding:15px;
  color:#ffcc00;
}

button {
  width:90%;
  max-width:340px;
  padding:16px;
  margin:10px auto;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#1e88e5;
  color:#fff;
  display:block;
}

.screen { display:none; }
.active { display:block; }

#trainerBoard {
  width:320px;
  height:320px;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(8,1fr);
}

.square {
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.white { background:#eee; color:#000; }
.black { background:#555; }
</style>
</head>

<body>

<h2>♔ ♕ ♙ TOSHIT CHESS HUB ♖ ♘ ♗</h2>

<div id="home" class="screen active">

<button onclick="go('play')">▶ Play Like GM</button>

<button onclick="go('trainer')">🎯 Guess Move Trainer</button>

</div>

<!-- PLAY -->
<div id="play" class="screen">

<h3>Select GM</h3>

<button onclick="setPlayer('carlsen')">Carlsen</button>
<button onclick="setPlayer('anand')">Anand</button>
<button onclick="setPlayer('tal')">Tal</button>

<button onclick="startGame()">🚀 START</button>
<button onclick="go('home')">⬅ Back</button>

</div>

<!-- TRAINER -->
<div id="trainer" class="screen">

<h3>Guess Best Move</h3>

<div id="trainerBoard"></div>

<p>White to move</p>

<button onclick="checkMove('e4')">e4</button>
<button onclick="checkMove('d4')">d4</button>
<button onclick="checkMove('h4')">h4</button>

<p id="result"></p>

<button onclick="go('home')">⬅ Back</button>

</div>

<script>

let player="";

function go(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(id==="trainer"){
    loadBoard();
  }
}

function setPlayer(p){
  player=p;
}

function startGame(){

  if(player==="carlsen"){
    window.location.href="https://lichess.org/";
  }
  else if(player==="anand"){
    window.location.href="https://www.chess.com/play";
  }
  else if(player==="tal"){
    window.location.href="https://lichess.org/training";
  }
}

// ✅ NO LIBRARY BOARD (100% WORKING)
function loadBoard(){

  let board = document.getElementById("trainerBoard");
  board.innerHTML="";

  let pieces = [
    "♜","♞","♝","♛","♚","♝","♞","♜",
    "♟","♟","♟","♟","♟","♟","♟","♟",
    "","","","","","","","",
    "","","","","","","","",
    "","","","","","","","",
    "","","","","","","","",
    "♙","♙","♙","♙","♙","♙","♙","♙",
    "♖","♘","♗","♕","♔","♗","♘","♖"
  ];

  for(let i=0;i<64;i++){
    let sq = document.createElement("div");

    let row = Math.floor(i/8);
    let col = i%8;

    sq.className = "square " + ((row+col)%2===0 ? "white":"black");

    sq.innerText = pieces[i];

    board.appendChild(sq);
  }
}

// check move
function checkMove(move){

  if(move==="e4"){
    result.innerHTML="✅ सही move!";
  } else {
    result.innerHTML="❌ गलत! सही: e4";
  }

}

</script>

</body>
</html>
