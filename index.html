<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toshit Chess Hub</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"/>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<style>
body{
  margin:0;
  background:#222;
  color:white;
  text-align:center;
  font-family:Arial;
}

h2{
  color:#ffcc00;
  margin-top:20px;
}

button{
  width:90%;
  max-width:320px;
  padding:15px;
  margin:15px auto;
  border:none;
  border-radius:10px;
  background:#1e88e5;
  color:white;
  font-size:18px;
  display:block;
}

#board{
  width:320px;
  margin:20px auto;
}
</style>
</head>

<body>

<h2>♕ Play Like GM - Anand ♔</h2>

<button onclick="startGame()">🚀 START GAME</button>

<div id="board"></div>

<script>

let game;
let board;

function startGame(){

  moveIndex = 0;

  game = new Chess();

board = Chessboard('board', {
  position: 'start',
  orientation: 'black',
  draggable: true,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDrop: onDrop
  });

  setTimeout(function(){
    game.move('e4');
    board.position(game.fen());
  },500);
}

function onDrop(source, target){

  let move = game.move({
    from: source,
    to: target,
    promotion: 'q'
  });

  if(move === null){
    return 'snapback';
  }

  setTimeout(aiMove,500);
}
// Anand opening memory
// Anand opening memory
let anandLine = [
  "e5",
  "Nc6",
  "Nf6",
  "Bc5",
  "d6",
  "O-O"
];

let moveIndex = 0;

// Better AI Move
function aiMove(){

  // पहले opening line
  if(moveIndex < anandLine.length){

    let move = anandLine[moveIndex];

    let result = game.move(move);

    if(result !== null){

      moveIndex++;

      board.position(game.fen());

      return;
    }
  }

  // सभी legal moves
  let moves = game.moves({verbose:true});

  if(moves.length === 0){
    return;
  }

  // सबसे पहले capture ढूंढो
  let captureMoves = moves.filter(m => m.flags.includes('c'));

  let selectedMove;

  // अगर capture available है
  if(captureMoves.length > 0){

    // सबसे valuable capture चुनो
    let pieceValue = {
      p:1,
      n:3,
      b:3,
      r:5,
      q:9,
      k:100
    };

    captureMoves.sort((a,b)=>{
      return pieceValue[b.captured] - pieceValue[a.captured];
    });

    selectedMove = captureMoves[0];

  } else {

    // center control preference
    let centerMoves = moves.filter(m =>
      ['d4','e4','d5','e5'].includes(m.to)
    );

    if(centerMoves.length > 0){
      selectedMove = centerMoves[Math.floor(Math.random()*centerMoves.length)];
    } else {
      selectedMove = moves[Math.floor(Math.random()*moves.length)];
    }
  }

  game.move(selectedMove);

  board.position(game.fen());
}
</script>

</body>
</html>
