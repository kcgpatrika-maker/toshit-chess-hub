<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toshit Chess Hub</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"/>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="stockfish.js"></script>  
<style>
body{
  margin:0;
  background:#222;
  color:white;
  text-align:center;
  font-family:Arial;
}

h2{
  color:#ffcc00;
  margin-top:20px;
}

button{
  width:90%;
  max-width:320px;
  padding:15px;
  margin:15px auto;
  border:none;
  border-radius:10px;
  background:#1e88e5;
  color:white;
  font-size:18px;
  display:block;
}

#board{
  width:320px;
  margin:20px auto;
}
</style>
</head>

<body>

<h2>♕ Play Like GM - Anand ♔</h2>

<button onclick="startGame()">🚀 START GAME</button>

<div id="board"></div>

<script>

let game;
let board;
let engine = new Worker("stockfish.js");
let skillLevel = 8;

let gmStyle = {
  openingMoves: ["e4","Nf3","Bb5","Ba4","O-O"],
  moveTime: 1200
};

let openingIndex = 0;  
  
function startGame(){

  game = new Chess();
engine.postMessage("uci");

engine.postMessage("setoption name Skill Level value " + skillLevel);

engine.postMessage("ucinewgame");
board = Chessboard('board', {
  position: 'start',
 orientation: 'white',
  draggable: true,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDrop: onDrop
  });
  }

function onDrop(source, target){

  let move = game.move({
    from: source,
    to: target,
    promotion: 'q'
  });

  if(move === null){
    return 'snapback';
  }

  board.position(game.fen());

  setTimeout(function(){
    aiMove();
  },300);

  return;
}
// Anand opening memory
let anandLine = [
  "e5",
  "Nc6",
  "Nf6",
  "Bc5",
  "d6",
  "O-O"
];

let moveIndex = 0;

// Better AI Move
function aiMove(){
if(openingIndex < gmStyle.openingMoves.length){

  let openingMove = gmStyle.openingMoves[openingIndex];

  let result = game.move(openingMove);

  if(result !== null){

    openingIndex++;

    board.position(game.fen());

    return;
  }
}
  engine.postMessage("position fen " + game.fen());

  engine.postMessage("go movetime " + gmStyle.moveTime);
  
  engine.onmessage = function(event){

    let line = event.data;

    if(line.startsWith("bestmove")){

      let move = line.split(" ")[1];

      if(move === "(none)"){
        return;
      }

      game.move({
        from: move.substring(0,2),
        to: move.substring(2,4),
        promotion: 'q'
      });

      board.position(game.fen());
    }
  };
}
 
</script>

</body>
</html>
