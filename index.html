body{
  margin:0;

}

h2{

button{
  width:90%;

  box-shadow: inset 0 0 3px 3px yellow;

<body>

<h2>♕ Play Like GM - Anand ♔</h2>

<button onclick="startGame()">🚀 START GAME</button>

<div id="board"></div>

<script>

let game;
let board;
let engine = new Worker("stockfish.js");
let playerTurn = true;  
let skillLevel = 8;

let gmStyle = {
  openingMoves: ["e4","Nf3","Bb5","Ba4","O-O"],
  moveTime: 1200
};

let openingIndex = 0;  
function resetGame(){

  game = new Chess();

  openingIndex = 0;

  playerTurn = true;

  engine.postMessage("ucinewgame");
}  
function startGame(){

 resetGame();
engine.postMessage("uci");

engine.postMessage("setoption name Skill Level value " + skillLevel);

engine.postMessage("ucinewgame");
document.getElementById("board").innerHTML = "";  
board = Chessboard('board', {
  position: 'start',
 orientation: 'white',
  draggable: true,
  moveSpeed: 200,
  snapbackSpeed: 200,
  snapSpeed: 100,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDrop: onDrop
  });
  }
$('#board').on('touchstart click', '.square-55d63', function(){

  let square = $(this).attr('data-square');

  if(!window.selectedSquare){

    window.selectedSquare = square;

    return;
  }

  let move = game.move({
    from: window.selectedSquare,
    to: square,
    promotion: 'q'
  });

  window.selectedSquare = null;

  if(move === null){
    return;
  }

  board.position(game.fen());

});
function onDrop(source, target){
if(!playerTurn){

}

  });

    return 'snapback';
  }

  aiMove();

// Anand opening memory
let anandLine = [
  "e5",

  "Bc5",

  "O-O"
];

let moveIndex = 0;

// Better AI Move
function aiMove(){
if(openingIndex < gmStyle.openingMoves.length){

  let openingMove = gmStyle.openingMoves[openingIndex];

  let result = game.move(openingMove);

  if(result !== null){

    openingIndex++;

    board.position(game.fen());
playerTurn = true;
    return;
  }
}
  engine.postMessage("position fen " + game.fen());

  engine.postMessage("go movetime " + gmStyle.moveTime);
  
  engine.onmessage = function(event){

    let line = event.data;

    if(line.startsWith("bestmove")){

      let move = line.split(" ")[1];

      if(move === "(none)"){
        return;
      }

 let fromSquare = move.substring(0,2);

game.move({

});
      board.position(game.fen());

}
