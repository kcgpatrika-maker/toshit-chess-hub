<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toshit Chess Hub - Play Like GM</title>

<!-- Chessboard + Chess.js + Stockfish -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stockfish/stockfish.js"></script>

<style>
body { margin:0; font-family:Arial; text-align:center; background:#222; color:#fff; }
h2 { font-size:26px; padding:10px; color:#ffcc00; }
button { width:90%; max-width:340px; padding:14px; margin:10px auto; font-size:18px; border:none; border-radius:10px; background:#1e88e5; color:#fff; display:block; }
button:active { transform:scale(0.96); background:#1565c0; }
#trainerBoard { margin:20px auto; }
</style>
</head>
<body>

<h2>♕ Play Like GM - Anand ♔</h2>

<div id="play">
  <button onclick="startGame()">🚀 START GAME vs Anand</button>
  <div id="trainerBoard" style="width:350px;"></div>
</div>

<script>
// Anand का प्रोफ़ाइल
const gmProfile = {
  name: "Viswanathan Anand",
  openings: ["e4","c4","Nf3"]
};

let game, board, engine;

// Start Game
function startGame(){
  game = new Chess();

  // बोर्ड initialize
  board = Chessboard('trainerBoard', {
    draggable:true,
    position:'start',
    onDrop: onDrop
  });

  // Stockfish engine
  engine = Stockfish();

  // Anand की पहली चाल
  let move = gmProfile.openings[Math.floor(Math.random()*gmProfile.openings.length)];
  game.move(move);
  board.position(game.fen());   // पहली चाल दिखाने के लिए जरूरी
}

// Handle player move
function onDrop(source, target){
  let move = game.move({from:source, to:target, promotion:'q'});
  if(move===null) return 'snapback';

  board.position(game.fen());

  // Opponent move via Stockfish
  setTimeout(()=>engineMove(),1000);
}

// Opponent move
function engineMove(){
  // Stockfish को सही sequence भेजना
  engine.postMessage('uci');
  engine.postMessage('isready');
  engine.postMessage('ucinewgame');
  engine.postMessage('position fen '+game.fen());
  engine.postMessage('go depth 10');

  engine.onmessage = function(line){
    if(line.includes('bestmove')){
      let parts=line.split(' ');
      if(parts[1]){
        game.move(parts[1],{sloppy:true});
        board.position(game.fen());
      }
    }
  };
}
</script>

</body>
</html>
